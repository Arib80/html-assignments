<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information Table</title>
</head>
<body>

    <table border="1" align="center"                   cellpadding="5">
        <caption><b>Employee                       Information Table</b>
        </caption>
        <tr>
            <th>Emp ID</th>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Salary</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Usman</td>
            <td>IT</td>
            <td>60,000</td>
        </tr>

        <tr>
            <td rowspan="2">102</td>
            <td>Tariq</td>
            <td>Accounts</td>
            <td>70,000</td>
        </tr>
        
        <tr>
            <td>Tariq (Bonus)</td>
            <td>Accounts</td>
            <td>15,000</td>
        </tr>
        
        <tr>
            <td colspan="3">Total Employees             </td>
            <td>2</td>
        </tr>
    </table>

</body>
</html>
