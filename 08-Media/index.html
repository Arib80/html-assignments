<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobbies</title>
</head>
<body>

    <!-- Heading -->
    <h1>My Hobbies</h1>

    <!-- 1. Local Image -->
    <img src="image/hobby.jpg" alt="My Local Hobby Image" width="300" height="300" title="Local Hobby">

    <br><br>

    <!-- 2. Online Image -->
    <img src="https://picsum.photos/400" alt="Online Coding Image" width="300" height="300" title="Online Image">
    <br><br>
    <!-- 3. Audio Clip -->
    <audio controls>
        <source src="audio/audio.mp3" type="audio/mpeg">
    </audio>
    <br><br>

    <!-- 4. Local Video -->
    <video controls width="400" height="400">
        <source src="video/video.mp4" type="video/mp4">
    </video>
    <br><br>
  

    <!-- 5. YouTube Video Embed -->
    <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="400" height="300" 
        allowfullscreen 
        title="YouTube Video">
    </iframe>
    <br><br>

    <!-- 6. Google Map Embed (Karachi) -->
    <iframe 
        src="https://maps.google.com/maps?q=Karachi&t=&z=13&ie=UTF8&iwloc=&output=embed" width="600" height="450" 
        allowfullscreen 
        title="Map of Karachi">
    </iframe>

</body>
</html>
